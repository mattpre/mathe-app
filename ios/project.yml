name: MatheApp
options:
  bundleIdPrefix: ch.matheapp
  deploymentTarget:
    iOS: "16.0"
targets:
  MatheApp:
    type: application
    platform: iOS
    sources: [MatheApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.matheapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mathe-App
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
  MatheAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MatheAppTests]
    dependencies:
      - target: MatheApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.matheapp.tests
